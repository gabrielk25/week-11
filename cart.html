<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang Belanja — Nails Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="brand-link">
        <div class="brand-name">Nails Studio</div>
        <div class="brand-tagline">Keranjang Belanja</div>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-btn">Katalog</a>
        <a href="history.html" class="nav-btn">Riwayat Pesanan</a>
        <a href="cart.html" class="nav-btn active">Keranjang <span class="cart-badge">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="section-title">
      <span>Keranjang Belanja Anda</span>
      <a href="index.html" class="btn btn-outline" style="font-size:0.82rem;">&larr; Lanjut Belanja</a>
    </div>

    <div class="two-col" id="cart-layout">
      <div class="panel" id="cart-items-box"></div>
      <div class="panel" id="cart-summary-box"></div>
    </div>
  </main>

  <footer>
    <p><strong>Nails Studio</strong> — Katalog Resmi Kuku Palsu</p>
  </footer>

  <script src="app.js"></script>
  <script>
    const { getCart, updateCartQty, removeFromCart, getCartSubtotal, formatRupiah, escapeHtml } = window.NailsApp;

    function renderCart() {
      const cart = getCart();
      const itemsBox = document.getElementById("cart-items-box");
      const summaryBox = document.getElementById("cart-summary-box");

      if (!cart.length) {
        itemsBox.innerHTML = `
          <div style="text-align:center;padding:32px 10px;">
            <p style="color:var(--text-muted);margin-bottom:16px;">Keranjang belanja Anda masih kosong.</p>
            <a href="index.html" class="btn btn-primary">Lihat Katalog Kuku</a>
          </div>`;
        summaryBox.style.display = "none";
        return;
      }

      summaryBox.style.display = "block";
      itemsBox.innerHTML = cart.map((item) => `
        <div class="cart-item">
          <img src="${escapeHtml(item.gambar)}" alt="${escapeHtml(item.nama)}" />
          <div class="cart-item-info">
            <strong>${escapeHtml(item.nama)}</strong>
            <div style="font-size:0.82rem;color:var(--text-muted);">Bentuk: ${escapeHtml(item.bentuk)}</div>
            <div style="color:var(--primary);font-weight:700;margin-top:4px;">${formatRupiah(item.harga)}</div>
          </div>
          <div class="qty-control">
            <button onclick="changeQty('${item.id}', -1)">-</button>
            <span>${item.qty}</span>
            <button onclick="changeQty('${item.id}', 1)">+</button>
          </div>
          <button class="btn btn-outline" style="padding:6px 10px;color:var(--danger);" onclick="deleteItem('${item.id}')">Hapus</button>
        </div>
      `).join("");

      const subtotal = getCartSubtotal();
      const totalQty = cart.reduce((s, i) => s + i.qty, 0);

      summaryBox.innerHTML = `
        <h3 style="margin-bottom:14px;font-family:Georgia,serif;">Ringkasan Belanja</h3>
        <div class="summary-row">
          <span>Total Set Kuku (${totalQty} pcs)</span>
          <span>${formatRupiah(subtotal)}</span>
        </div>
        <div class="summary-row">
          <span>Estimasi Ongkos Kirim</span>
          <span>Dihitung saat checkout</span>
        </div>
        <div class="summary-total" style="margin-bottom:18px;">
          <span>Subtotal</span>
          <span>${formatRupiah(subtotal)}</span>
        </div>
        <a href="checkout.html" class="btn btn-primary btn-full">Lanjut ke Checkout &rarr;</a>
      `;
    }

    function changeQty(id, delta) {
      updateCartQty(id, delta);
      renderCart();
    }

    function deleteItem(id) {
      removeFromCart(id);
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
