<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang Belanja — Nails Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand-link">
        <span class="brand-title">Nails Studio</span>
        <span class="brand-sub">STORE</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Katalog</a>
        <a href="cart.html" class="nav-link active">Keranjang <span class="cart-badge">0</span></a>
        <a href="history.html" class="nav-link">Riwayat Transaksi</a>
      </nav>
    </div>
  </header>

  <section class="hero-banner">
    <div class="hero-eyebrow">LANGKAH 1 DARI 3</div>
    <h1>Keranjang Belanja</h1>
    <p>Atur jumlah pesanan atau hapus item sebelum melanjutkan ke halaman checkout.</p>
  </section>

  <main class="container">
    <div class="two-col" id="cart-layout">
      <div class="panel" id="cart-items-panel"></div>
      <div class="panel" id="cart-summary-panel"></div>
    </div>
  </main>

  <footer>
    <p><strong>Nails Studio</strong> — Toko Online Kuku Palsu Handmade</p>
    <p>Simulasi Pemesanan &amp; Pembayaran QRIS &bull; Instagram: @nailsstudio.id</p>
  </footer>

  <script src="app.js"></script>
  <script>
    const { getCart, updateCartQty, removeFromCart, clearCart, getCartCount, getCartSubtotal, formatRupiah, escapeHtml } = window.NailsApp;

    function renderCart() {
      const cart = getCart();
      const itemsPanel = document.getElementById("cart-items-panel");
      const summaryPanel = document.getElementById("cart-summary-panel");

      if (!cart.length) {
        itemsPanel.style.gridColumn = "1 / -1";
        itemsPanel.innerHTML = `
          <div style="text-align:center;padding:36px 12px;">
            <p style="color:var(--text-muted);margin-bottom:16px;">Keranjang belanja Anda masih kosong.</p>
            <a href="index.html" class="btn btn-primary">Lihat Katalog Kuku</a>
          </div>`;
        summaryPanel.style.display = "none";
        return;
      }

      itemsPanel.style.gridColumn = "auto";
      summaryPanel.style.display = "block";
      const totalItems = getCartCount();
      const subtotal = getCartSubtotal();
      const estOngkir = 15000;

      itemsPanel.innerHTML = `
        <div class="panel-header">
          <h3>Daftar Item (${totalItems})</h3>
          <button class="btn btn-danger-outline" onclick="handleClear()">Kosongkan Keranjang</button>
        </div>
        ${cart.map((item) => `
          <div class="cart-row">
            <div class="cart-left">
              <img src="${escapeHtml(item.gambar)}" alt="${escapeHtml(item.nama)}" class="cart-thumb" />
              <div>
                <div style="font-weight:700;font-size:0.98rem;">${escapeHtml(item.nama)}</div>
                <div style="font-size:0.8rem;color:var(--text-muted);margin:2px 0 4px;">Bentuk: ${escapeHtml(item.bentuk)} &bull; Satuan: / set</div>
                <div style="font-weight:700;color:var(--primary);font-size:0.9rem;">${formatRupiah(item.harga)} / set</div>
              </div>
            </div>
            <div class="cart-right">
              <div class="qty-box">
                <button onclick="handleQty('${item.id}', -1)">&minus;</button>
                <span>${item.qty}</span>
                <button onclick="handleQty('${item.id}', 1)">+</button>
              </div>
              <div style="font-weight:800;font-size:0.95rem;">${formatRupiah(item.harga * item.qty)}</div>
              <button class="btn btn-danger-outline" onclick="handleRemove('${item.id}')">Hapus</button>
            </div>
          </div>
        `).join("")}
      `;

      summaryPanel.innerHTML = `
        <div class="panel-header">
          <h3>Ringkasan Belanja</h3>
        </div>
        <div class="summary-row">
          <span>Subtotal (${totalItems} item)</span>
          <span>${formatRupiah(subtotal)}</span>
        </div>
        <div class="summary-row">
          <span>Estimasi Pengiriman Reguler</span>
          <span>${formatRupiah(estOngkir)}</span>
        </div>
        <div class="summary-grand" style="margin-bottom:18px;">
          <span>Grand Total</span>
          <span>${formatRupiah(subtotal + estOngkir)}</span>
        </div>
        <a href="checkout.html" class="btn btn-primary btn-full" style="margin-bottom:10px;">Lanjut ke Checkout &rarr;</a>
        <a href="index.html" class="btn btn-outline btn-full">+ Tambah Set Lainnya</a>
      `;
    }

    function handleQty(id, delta) { updateCartQty(id, delta); renderCart(); }
    function handleRemove(id) { removeFromCart(id); renderCart(); }
    function handleClear() { clearCart(); renderCart(); }

    renderCart();
  </script>
</body>
</html>
