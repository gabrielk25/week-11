<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pembayaran QRIS — Nails Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="brand-link">
        <div class="brand-name">Nails Studio</div>
        <div class="brand-tagline">Pembayaran QRIS</div>
      </a>
      <nav class="nav-links">
        <a href="history.html" class="nav-btn">Riwayat Pesanan</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width:650px;">
    <div class="panel" id="payment-root" style="text-align:center;"></div>
  </main>

  <footer>
    <p><strong>Nails Studio</strong> — Katalog Resmi Kuku Palsu</p>
  </footer>

  <script src="app.js"></script>
  <script>
    const { getOrders, formatRupiah, escapeHtml, ORDERS_KEY, channel } = window.NailsApp;
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order") || "";
    const root = document.getElementById("payment-root");

    function renderPayment() {
      const order = getOrders().find((o) => o.id === orderId);

      if (!order) {
        root.innerHTML = `
          <p style="color:var(--danger);margin-bottom:14px;">Pesanan tidak ditemukan.</p>
          <a href="index.html" class="btn btn-primary">Kembali ke Katalog</a>`;
        return;
      }

      if (order.status === "PAID") {
        window.location.href = `thank-you.html?order=${encodeURIComponent(order.id)}`;
        return;
      }

      if (order.status === "REJECTED") {
        root.innerHTML = `
          <span class="status-pill status-rejected">Pembayaran Ditolak</span>
          <h2 style="margin:14px 0 8px;">Transaksi Dibatalkan</h2>
          <p style="color:var(--text-muted);margin-bottom:18px;">Pembayaran untuk pesanan <strong>${escapeHtml(order.id)}</strong> ditolak oleh simulator QRIS.</p>
          <a href="index.html" class="btn btn-primary">Pesan Ulang</a>`;
        return;
      }

      root.innerHTML = `
        <span class="status-pill status-pending">Menunggu Pembayaran QRIS</span>
        <h2 style="margin:12px 0 4px;font-family:Georgia,serif;">Order #${escapeHtml(order.id)}</h2>
        <p style="color:var(--text-muted);font-size:0.9rem;">Atas nama <strong>${escapeHtml(order.customer.nama)}</strong></p>

        <div class="qris-box">
          <div style="font-weight:700;letter-spacing:1px;color:var(--primary);">QRIS NAILS STUDIO</div>
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" fill="#fff"/>
            <rect x="8" y="8" width="26" height="26" fill="none" stroke="#2d2325" stroke-width="5"/>
            <rect x="15" y="15" width="12" height="12" fill="#2d2325"/>
            <rect x="66" y="8" width="26" height="26" fill="none" stroke="#2d2325" stroke-width="5"/>
            <rect x="73" y="15" width="12" height="12" fill="#2d2325"/>
            <rect x="8" y="66" width="26" height="26" fill="none" stroke="#2d2325" stroke-width="5"/>
            <rect x="15" y="73" width="12" height="12" fill="#2d2325"/>
            <rect x="42" y="12" width="8" height="8" fill="#2d2325"/>
            <rect x="52" y="24" width="8" height="16" fill="#2d2325"/>
            <rect x="12" y="44" width="16" height="8" fill="#2d2325"/>
            <rect x="38" y="42" width="24" height="16" fill="#c9647a"/>
            <rect x="70" y="46" width="18" height="8" fill="#2d2325"/>
            <rect x="44" y="66" width="10" height="22" fill="#2d2325"/>
            <rect x="64" y="68" width="24" height="10" fill="#2d2325"/>
            <rect x="66" y="82" width="12" height="10" fill="#2d2325"/>
          </svg>
          <div style="font-size:1.25rem;font-weight:800;color:var(--text-main);">${formatRupiah(order.total)}</div>
          <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;">Halaman ini akan otomatis berpindah setelah QRIS disetujui</div>
        </div>

        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;">
          <a href="qris-approve.html?order=${encodeURIComponent(order.id)}" target="_blank" class="btn btn-primary">
            Buka Simulator Approve QRIS &nearr;
          </a>
          <button class="btn btn-outline" onclick="renderPayment()">Cek Status Manual</button>
        </div>
      `;
    }

    // Dengarkan perubahan real-time dari tab qris-approve.html
    if (channel) {
      channel.onmessage = function (ev) {
        if (ev.data && ev.data.orderId === orderId) {
          renderPayment();
        }
      };
    }

    window.addEventListener("storage", function (ev) {
      if (ev.key === ORDERS_KEY) {
        renderPayment();
      }
    });

    renderPayment();
  </script>
</body>
</html>
