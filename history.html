<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Pesanan — Nails Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="brand-link">
        <div class="brand-name">Nails Studio</div>
        <div class="brand-tagline">Riwayat Pesanan</div>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-btn">Katalog</a>
        <a href="history.html" class="nav-btn active">Riwayat Pesanan</a>
        <a href="qris-approve.html" class="nav-btn">Simulator QRIS</a>
        <a href="cart.html" class="nav-btn">Keranjang <span class="cart-badge">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="section-title">
      <span>Riwayat Pesanan Saya</span>
      <span class="section-count" id="order-count">0 Pesanan</span>
    </div>

    <div id="history-root"></div>
  </main>

  <footer>
    <p><strong>Nails Studio</strong> — Katalog Resmi Kuku Palsu</p>
  </footer>

  <script src="app.js"></script>
  <script>
    const { getOrders, formatRupiah, formatTime, escapeHtml, ORDERS_KEY, channel } = window.NailsApp;
    const root = document.getElementById("history-root");
    const countEl = document.getElementById("order-count");

    function renderHistory() {
      const orders = getOrders();
      countEl.textContent = `${orders.length} Pesanan`;

      if (!orders.length) {
        root.innerHTML = `
          <div class="panel" style="text-align:center;padding:32px;">
            <p style="color:var(--text-muted);margin-bottom:14px;">Belum ada riwayat pesanan.</p>
            <a href="index.html" class="btn btn-primary">Mulai Belanja</a>
          </div>`;
        return;
      }

      root.innerHTML = orders.map((order) => {
        let statusClass = "status-pending";
        if (order.status === "PAID") statusClass = "status-paid";
        if (order.status === "REJECTED") statusClass = "status-rejected";

        return `
          <div class="panel">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
              <div>
                <strong>Order #${escapeHtml(order.id)}</strong> &bull;
                <span style="font-size:0.85rem;color:var(--text-muted);">${formatTime(order.createdAt)}</span>
              </div>
              <span class="status-pill ${statusClass}">${escapeHtml(order.status)}</span>
            </div>

            <div style="font-size:0.88rem;color:var(--text-muted);margin-bottom:12px;">
              ${order.items.map((i) => `${escapeHtml(i.nama)} (${i.qty}x)`).join(", ")}
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:10px;border-top:1px dashed var(--border);">
              <div>Total: <strong style="color:var(--primary);">${formatRupiah(order.total)}</strong> (${escapeHtml(order.paymentMethod)})</div>
              <div style="display:flex;gap:8px;">
                ${order.status === "PENDING" && order.paymentMethod === "QRIS" ? `
                  <a href="payment.html?order=${encodeURIComponent(order.id)}" class="btn btn-primary" style="padding:7px 12px;font-size:0.82rem;">Bayar QRIS</a>
                ` : ""}
                <a href="thank-you.html?order=${encodeURIComponent(order.id)}" class="btn btn-outline" style="padding:7px 12px;font-size:0.82rem;">Detail Struk</a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    if (channel) {
      channel.onmessage = renderHistory;
    }
    window.addEventListener("storage", (ev) => {
      if (ev.key === ORDERS_KEY) renderHistory();
    });

    renderHistory();
  </script>
</body>
</html>
