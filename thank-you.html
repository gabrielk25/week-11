<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terima Kasih — Nails Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="brand-link">
        <div class="brand-name">Nails Studio</div>
        <div class="brand-tagline">Konfirmasi Pesanan</div>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-btn">Katalog</a>
        <a href="history.html" class="nav-btn">Riwayat Pesanan</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width:650px;">
    <div class="panel" id="thankyou-root" style="text-align:center;"></div>
  </main>

  <footer>
    <p><strong>Nails Studio</strong> — Katalog Resmi Kuku Palsu</p>
  </footer>

  <script src="app.js"></script>
  <script>
    const { getOrders, formatRupiah, formatTime, escapeHtml } = window.NailsApp;
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order") || "";
    const order = getOrders().find((o) => o.id === orderId);
    const root = document.getElementById("thankyou-root");

    if (!order) {
      root.innerHTML = `<p>Data pesanan tidak ditemukan.</p><a href="index.html" class="btn btn-primary" style="margin-top:14px;">Ke Katalog</a>`;
    } else {
      root.innerHTML = `
        <div style="width:60px;height:60px;border-radius:50%;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 14px;">&#10003;</div>
        <span class="status-pill status-paid">Pesanan Dikonfirmasi (${escapeHtml(order.paymentMethod)})</span>
        <h2 style="margin:12px 0 6px;font-family:Georgia,serif;">Terima Kasih, ${escapeHtml(order.customer.nama)}!</h2>
        <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:20px;">
          Pesanan <strong>#${escapeHtml(order.id)}</strong> telah kami terima pada ${formatTime(order.createdAt)} dan sedang disiapkan.
        </p>

        <div style="text-align:left;background:var(--bg-body);padding:16px;border-radius:12px;border:1px solid var(--border);margin-bottom:20px;">
          <div style="font-weight:700;margin-bottom:8px;">Rincian Pesanan:</div>
          ${order.items.map((i) => `
            <div class="summary-row">
              <span>${escapeHtml(i.nama)} (${escapeHtml(i.bentuk)}) &times; ${i.qty}</span>
              <span>${formatRupiah(i.harga * i.qty)}</span>
            </div>
          `).join("")}
          <div class="summary-row"><span>Ongkos Kirim (${escapeHtml(order.customer.pengiriman)})</span><span>${formatRupiah(order.ongkir)}</span></div>
          <div class="summary-total"><span>Total Lunas</span><span>${formatRupiah(order.total)}</span></div>
          <div style="font-size:0.83rem;color:var(--text-muted);margin-top:10px;">
            <strong>Ukuran Kuku:</strong> ${escapeHtml(order.customer.ukuran)}<br/>
            <strong>Alamat:</strong> ${escapeHtml(order.customer.alamat)}
          </div>
        </div>

        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <a href="index.html" class="btn btn-primary">Belanja Lagi</a>
          <a href="history.html" class="btn btn-outline">Lihat Semua Riwayat</a>
        </div>
      `;
    }
  </script>
</body>
</html>
